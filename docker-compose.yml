services:
  db:
    image: pgvector/pgvector:pg16
    container_name: findocbot-db
    environment:
      POSTGRES_DB: findocbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d findocbot"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.35.1
    container_name: findocbot-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # The image ships no curl or wget; the CLI fails if the server is down.
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 5
        for model in $$FINDOCBOT_MODELS; do
          echo "Pulling $$model ..."
          ollama pull "$$model"
        done
        wait
    environment:
      # Not OLLAMA_MODELS: Ollama reads that as the models directory path,
      # which would store the downloads outside the volume.
      FINDOCBOT_MODELS: "qwen2.5:7b nomic-embed-text:latest"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findocbot-api
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      POSTGRES_DSN: postgresql://postgres:postgres@db:5432/findocbot
      # Sizes chunks.embedding in migrations; keep in sync with .env.
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
    # Run migrations before serving; Alembic tracks applied revisions in a
    # version table, so this is a no-op when nothing changed.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn findocbot.main:create_app --factory
             --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
