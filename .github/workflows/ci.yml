name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

# A newer push supersedes a run still going on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # python-coverage-comment-action pushes the badge to a data branch
      # and posts the coverage diff as a PR comment.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src/findocbot
      - name: Run tests
        run: uv run pytest -q --cov=src/findocbot --cov-report=term --cov-fail-under=90

      - name: Coverage badge and PR comment
        # ``v3`` is a moving tag. Resolved 2026-10-15 it is a commit 65 past
        # the last v3 release (v3.41) and 46 before v4.1, with no release tag
        # of its own; pinned as resolved so the code CI runs does not change.
        uses: py-cov-action/python-coverage-comment-action@50d15ff8768f6d897b04e5a0805bd1a98f7096c4 # v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run integration tests
        run: uv run pytest -q --integration -m integration

  e2e:
    runs-on: ubuntu-24.04
    # Bounds the ~670 MB model pulls: ``ollama pull`` has no timeout of its own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Run end-to-end tests
        run: make e2e
